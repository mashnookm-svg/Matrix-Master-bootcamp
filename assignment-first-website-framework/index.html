<!DOCTYPE html>
<html>
    <head>
        <meta name="description" content="My first personal website">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>My first website</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <div class="container my-5">
             <h1 class="mb-3">Welcome to my website</h1>
             <p class="lead">This is my first personal <span class="text-primary fw-blod">website</span>.</p>
             <ul class="list-group mb-4">
                <li class="list-group-item">HTML</li>
                <li class="list-group-item">CSS</li>
                <li class="list-group-item">Javascript</li>
             </ul>
             
             <a href="https://www.google.com" class="btn btn-outline-primary mb-4">Visit Google</a>

             <table class="table table-striped">
                <thead>
                    <tr>
                        <th>Language</th>
                        <th>Level</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>HTML</td>
                        <td>Beginner</td>
                    </tr>
                    <tr>
                        <td>CSS</td>
                        <td>Beginner</td>
                    </tr>
                </tbody>
             </table>
             <form>
                <input type="text" class="form-control mb-3" placeholder="Your name">

                <p>Which technologies do you like?</p>

                <input type="checkbox">HTML
                <input type="checkbox">CSS
                <input type="checkbox">Javascript
                <input type="checkbox">Python

                <p>What is your level?</p>

                <input type="radio" name="level">Beginner
                <input type="radio" name="level">Intermediate
                <input type="radio" name="level">Advanced

                <p>Choose your country:</p>
                <select class="form -select mb-3">
                    <option>Netherlands</option>
                    <option>Syria</option>
                    <option>Turkey</option>
                    <option>katar</option>
                </select>

                <br><br>

                <input type="submit" class="btn btn-primary" value="send">

             </form>

        </div>
       
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
