<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sign in to twitter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-card">
        <img src="Twitter/Screenshot 2023-07-12 at 17.36.57.png" alt="twitter" class="logo-icon">
        <h2>Sign in to Twitter</h2>
        <button class="google-btn">
            <img src="Twitter/Screenshot 2023-07-12 at 17.37.15.png" alt="Google logo" class="btn-icon">
            Sign in with Google
        </button>
        <button class="apple-btn">
            <img src="Twitter/Screenshot 2023-07-12 at 17.37.24.png" alt="apple logo" class="btn-icon">
            Sign in with Apple</button>
            <div class="divider">or</div>
        <input type="text" placeholder="phone, email, or username">
        <button class="next-btn">Next</button>
        <button>Forgot password?</button>
        <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
    
</body>
</html>
