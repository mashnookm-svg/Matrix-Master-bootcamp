<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>google-beta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="google-page">
    
    <div class="logo-section">
      <img src="logo.jpg" alt="Google! Beta Logo" class="google-logo">
    </div>

    <div class="search-section">
      <p>Search the web using Google!</p>
      <form>
        <input type="text" class="search-input" name="q"><br>
        <button type="submit" class="search-btn">Google Search</button>
        <button type="button" class="search-btn">I'm feeling lucky</button>
      </form>
    </div>

        <div class="blue-boxes-container">
      
            <div class="box left-box">
                <a href="#">Special Searches</a><br>
                <a href="#">Stanford Search</a><br>
                <a href="#">Linux Search</a>
            </div>
      
            <div class="box center-box">
                <a href="#">Help!</a><br>
                <a href="#">About Google</a><br>
                <a href="#">Company Info</a>
            </div>
      
            <div class="box right-box">
                <p>Get Google!</p>
                <p class="sub-text">updates monthly:</p>
                <input type="email" placeholder="your e-mail">
                <button type="button">Subscribe</button>
                <a href="#">Archive</a>
            </div>

        </div>

    <div class="footer-section">
      <p>Copyright ©1998 Google Inc.</p>
    </div>

  </div>
</body>
</html>
