<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom</title>
</head>
<body>
    <button onclick="changeText()">Click me</button>
    <p id="myDiv">Original text here.</p>
    <script>
        function changeText() {
            document.getElementById("myDiv").textContent = "Text has been changed!";
        }
    </script>
</body>
</html>
