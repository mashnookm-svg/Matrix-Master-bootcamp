<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=i">
    <title>ChangeImage</title>
</head>
<body>
    <img id="myImage" src="pool.jpg.png" alt="pool">
    <br>
    <button onclick="changeImage()">Change Image</button>

    <script>
        function changeImage() {
            document.getElementById("myImage").src = "dc.jpg.png";
        }
    </script>
    
</body>
</html>
